name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/academyhub?schema=public
      BETTER_AUTH_SECRET: ci-placeholder-auth-secret-1234567890
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      GEMINI_API_KEY: ci-placeholder-gemini-key
      NEXT_PUBLIC_ENABLE_AI_PIPELINE: 'false'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: academyhub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d academyhub"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Type check
        run: npx tsc --noEmit

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npx vitest run

      - name: Build app
        env:
          NODE_ENV: production
        run: npx next build

      - name: Run ESLint
        run: |
          npx eslint . --format json --output-file eslint-report.json
          node -e "const fs=require('fs');const report=JSON.parse(fs.readFileSync('eslint-report.json','utf8'));const files=report.length;const errors=report.reduce((n,f)=>n+f.errorCount,0);const warnings=report.reduce((n,f)=>n+f.warningCount,0);console.log(JSON.stringify({files,errors,warnings},null,2));"
